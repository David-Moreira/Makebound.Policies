<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Legal documents for Makebound.">
  <title>Makebound - Legal Documents</title>
  <style>
    :root {
      color-scheme: light;
      --background: #ffffff;
      --text: #24292f;
      --muted: #57606a;
      --heading: #1f2328;
      --border: #d0d7de;
      --surface: #f6f8fa;
      --link: #0969da;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(100% - 2rem, 760px);
      margin: 0 auto;
      padding: 4rem 0;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    h1 {
      margin: 0 0 0.5rem;
      color: var(--heading);
      font-size: clamp(2.2rem, 6vw, 3rem);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .documents {
      display: grid;
      gap: 1rem;
    }

    .document {
      display: block;
      padding: 1.25rem 1.35rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      transition: border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
    }

    .document:hover,
    .document:focus-visible {
      border-color: var(--link);
      box-shadow: 0 3px 12px rgb(27 31 36 / 12%);
      transform: translateY(-1px);
    }

    .document:focus-visible { outline: 3px solid rgb(9 105 218 / 25%); }

    h2 {
      margin: 0 0 0.25rem;
      color: var(--link);
      font-size: 1.15rem;
    }

    .document p {
      margin: 0;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      main { padding-top: 2.5rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Makebound</h1>
      <p>Welcome to Makebound! Build, create, and explore.</p>
    </header>

    <section class="documents" aria-label="Legal documents">
      <a class="document" href="privacy-policy.html">
        <h2>Privacy Policy</h2>
        <p>Learn how we protect your privacy and handle your data.</p>
      </a>
    </section>
  </main>
</body>
</html>
